name: Recordatorio de agua

on:
  # Lo dispara cron-job.org por API. El mensaje se elige solo según la hora
  # de Guatemala. Si se manda el input "mensaje", ese tiene prioridad.
  workflow_dispatch:
    inputs:
      mensaje:
        description: "Mensaje personalizado (opcional, si lo dejás vacío se elige por hora)"
        required: false
        default: ""

jobs:
  recordar:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar mensaje a Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Se pasa por variable de entorno (no directo en el script) por seguridad
          MENSAJE_CUSTOM: ${{ inputs.mensaje }}
        run: |
          HORA=$(TZ=America/Guatemala date +%-H)

          if [ -n "$MENSAJE_CUSTOM" ]; then
            MENSAJE="$MENSAJE_CUSTOM"
          else
            case "$HORA" in
              5|6|7)
                MENSAJE="🫗 ¡Qué onda vos! Llená el pachón antes de que se te olvide 💧😎" ;;
              8|9)
                MENSAJE="☀️ Vos, ¿ya te tomaste el primer vaso de agua? Dale pues 💧🙌" ;;
              10|11|12)
                MENSAJE="🤙 ¿Cómo vas con el agüita, vos? Dale un buen trago al pachón 🚰" ;;
              13|14|15)
                MENSAJE="🍽️ Ya almorzaste, ¿verdad? Pues acordate de tomar agua 💧 no te me deshidratés 😅" ;;
              16|17)
                MENSAJE="🌇 Vos, ya van las 4... ¿cómo vas con el agua? 💧 Tomá un buen trago 🥤" ;;
              18|19|20|21|22|23)
                MENSAJE="🌙 Última llamada del día: ¿cumpliste con el agua o qué onda? 💧✅" ;;
              *)
                MENSAJE="💧 ¡Vos, tomá agua! 😎" ;;
            esac
          fi

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MENSAJE}"
