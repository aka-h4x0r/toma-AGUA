name: Recordatorio de agua

on:
  schedule:
    # Horas en UTC (Guatemala = UTC-6)
    - cron: "30 13 * * *"  # 7:30 am Guatemala
    - cron: "0 14 * * *"   # 8:00 am Guatemala
    - cron: "0 17 * * *"   # 11:00 am Guatemala
    - cron: "0 20 * * *"   # 2:00 pm Guatemala
    - cron: "0 22 * * *"   # 4:00 pm Guatemala
    - cron: "0 2 * * *"    # 8:00 pm Guatemala
  workflow_dispatch: # permite probarlo manualmente desde la pestaña Actions

jobs:
  recordar:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar mensaje a Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            "30 13 * * *")
              MENSAJE="🫗 ¡Qué onda vos! Llená el pachón antes de que se te olvide 💧😎" ;;
            "0 14 * * *")
              MENSAJE="☀️ Vos, ¿ya te tomaste el primer vaso de agua? Dale pues 💧🙌" ;;
            "0 17 * * *")
              MENSAJE="🤙 ¿Cómo vas con el agüita, vos? Dale un buen trago al pachón 🚰" ;;
            "0 20 * * *")
              MENSAJE="🍽️ Ya almorzaste, ¿verdad? Pues acordate de tomar agua 💧 no te me deshidratés 😅" ;;
            "0 22 * * *")
              MENSAJE="🌇 Vos, ya van las 4... ¿cómo vas con el agua? 💧 Tomá un buen trago 🥤" ;;
            "0 2 * * *")
              MENSAJE="🌙 Última llamada del día: ¿cumpliste con el agua o qué onda? 💧✅" ;;
            *)
              MENSAJE="💧 ¡Prueba exitosa vos! El bot ya funciona 🎉😎" ;;
          esac

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MENSAJE}"
