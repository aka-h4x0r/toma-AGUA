name: Recordatorio de agua

on:
  # Lo dispara cron-job.org por API, con el mensaje en el input "mensaje".
  # También se puede correr a mano desde la pestaña Actions.
  workflow_dispatch:
    inputs:
      mensaje:
        description: "Mensaje a enviar por Telegram"
        required: false
        default: "💧 ¡Prueba exitosa vos! El bot ya funciona 🎉😎"

jobs:
  recordar:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar mensaje a Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Se pasa por variable de entorno (no directo en el script) por seguridad
          MENSAJE: ${{ inputs.mensaje }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MENSAJE}"
